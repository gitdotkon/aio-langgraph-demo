readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.27.2",
    "agent-sandbox",
    "deepagents>=0.4.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
