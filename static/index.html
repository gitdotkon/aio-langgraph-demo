<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIO DeepAgents · Agent 交互界面</title>
<style>
  /* ============ 主题变量 ============ */
  :root {
    --c-bg: #0f1117;
    --c-surface: #171a23;
    --c-surface-2: #1f2330;
    --c-border: #2a2f3d;
    --c-fg: #e6e8ee;
    --c-fg-muted: #9aa3b2;
    --c-primary: #4f8cff;
    --c-primary-fg: #ffffff;
    --c-user: #2b3a55;
    --c-assistant: #1c2230;
    --c-tool: #26304a;
    --c-error: #e5484d;
    --c-ok: #46c46a;
    --c-radius: 12px;
    --c-radius-sm: 8px;
    --c-gap: 14px;
    --c-font: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    --c-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--c-bg);
    color: var(--c-fg);
    font-family: var(--c-font);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ============ 应用骨架布局 ============ */
  .c-app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  .c-app__header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
  }
  .c-app__logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--c-primary), #8a5cff);
    display: grid; place-items: center;
    font-weight: 700; color: #fff; font-size: 14px;
  }
  .c-app__title { font-size: 16px; font-weight: 600; margin: 0; }
  .c-app__meta {
    margin-left: auto;
    font-size: 12px;
    color: var(--c-fg-muted);
    font-family: var(--c-mono);
  }

  .c-app__body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 6px var(--panel-w, 460px);
    grid-template-rows: minmax(0, 1fr);
    gap: 1px;
    background: var(--c-border);
    overflow: hidden;
  }

  /* 可拖拽分隔条（调整左右栏宽度） */
  .c-splitter {
    cursor: col-resize;
    background: var(--c-border);
    position: relative;
    border: 0;
    padding: 0;
    touch-action: none;
  }
  .c-splitter::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: -4px; right: -4px;
  }
  .c-splitter::after {
    content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 2px; height: 30px; border-radius: 2px; background: var(--c-fg-muted); opacity: .5;
  }
  .c-splitter:hover, .c-splitter:focus-visible, .c-app--resizing .c-splitter { background: var(--c-primary); }
  .c-splitter:focus-visible { outline: 2px solid var(--c-primary); outline-offset: -2px; }
  .c-app--resizing { user-select: none; cursor: col-resize; }
  .c-app--resizing iframe { pointer-events: none; }  /* 拖拽时不让预览 iframe 抢指针 */

  @media (max-width: 900px) {
    .c-app__body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .c-splitter { display: none; }
  }

  /* ============ 聊天面板 ============ */
  .c-chat {
    display: flex;
    flex-direction: column;
    background: var(--c-bg);
    min-width: 0;
    min-height: 0;
  }
  .c-chat__log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: var(--c-gap);
  }

  .c-msg {
    max-width: 820px;
    width: fit-content;
    padding: 10px 14px;
    border-radius: var(--c-radius);
    white-space: pre-wrap;
    word-break: break-word;
    animation: c-fade .18s ease;
  }
  @keyframes c-fade { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  .c-msg--user { align-self: flex-end; background: var(--c-user); }
  .c-msg--assistant { align-self: flex-start; background: var(--c-assistant); border: 1px solid var(--c-border); }
  .c-msg--error { align-self: flex-start; background: rgba(229,72,77,.12); border: 1px solid var(--c-error); color: #ffb3b5; }
  .c-msg--system { align-self: flex-start; background: var(--c-surface-2); border: 1px dashed var(--c-border); color: var(--c-fg-muted); }

  .c-msg__role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--c-fg-muted);
    margin-bottom: 4px;
  }

  /* 工具调用步骤 */
  .c-step { align-self: flex-start; width: min(820px, 100%); display: flex; flex-direction: column; gap: 6px; }
  .c-chip {
    --c-chip-bg: var(--c-tool);
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--c-chip-bg);
    border: 1px solid var(--c-border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--c-fg);
    width: fit-content;
  }
  .c-chip__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-primary); }
  .c-chip--result .c-chip__dot { background: var(--c-ok); }

  .c-detail {
    background: var(--c-surface-2);
    border: 1px solid var(--c-border);
    border-radius: var(--c-radius-sm);
    overflow: hidden;
  }
  .c-detail > summary {
    cursor: pointer; padding: 6px 12px; font-size: 12px; color: var(--c-fg-muted);
    list-style: none; user-select: none;
  }
  .c-detail > summary::-webkit-details-marker { display: none; }
  .c-detail > summary::before { content: "▸ "; }
  .c-detail[open] > summary::before { content: "▾ "; }
  .c-detail__body {
    margin: 0; padding: 10px 12px; border-top: 1px solid var(--c-border);
    font-family: var(--c-mono); font-size: 12px; color: var(--c-fg);
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }

  /* 打字指示器 */
  .c-typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 10px 14px; background: var(--c-assistant); border: 1px solid var(--c-border); border-radius: var(--c-radius); }
  .c-typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--c-fg-muted); animation: c-blink 1.2s infinite; }
  .c-typing span:nth-child(2){ animation-delay: .2s } .c-typing span:nth-child(3){ animation-delay: .4s }
  @keyframes c-blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  .c-empty { margin: auto; text-align: center; color: var(--c-fg-muted); max-width: 420px; }
  .c-empty__title { color: var(--c-fg); font-size: 18px; margin-bottom: 8px; }

  /* 输入区（固定不被压缩，日志区内部滚动） */
  .c-composer {
    flex: none;
    display: flex; gap: 10px; align-items: flex-end;
    padding: 14px 20px; border-top: 1px solid var(--c-border); background: var(--c-surface);
  }
  .c-composer__input {
    flex: 1; resize: none; max-height: 160px; min-height: 44px;
    background: var(--c-bg); color: var(--c-fg);
    border: 1px solid var(--c-border); border-radius: var(--c-radius);
    padding: 12px 14px; font: inherit; font-family: var(--c-font);
  }
  .c-composer__input:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 1px; }

  .c-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 12px 18px; border: 1px solid transparent; border-radius: var(--c-radius);
    background: var(--c-primary); color: var(--c-primary-fg);
    font: inherit; font-weight: 600; cursor: pointer; height: 44px;
    transition: filter .15s ease;
  }
  .c-btn:hover { filter: brightness(.92); }
  .c-btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
  .c-btn[disabled] { opacity: .5; cursor: not-allowed; }
  .c-btn--ghost { background: transparent; color: var(--c-fg); border-color: var(--c-border); }
  .c-btn--danger { background: var(--c-error); color: #fff; }
  .c-btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
  .c-composer__actions { display: flex; gap: 8px; }

  /* 后台任务条（状态信息）：条数多时自身滚动，不挤压上方内容 */
  .c-bgbar {
    flex: none;
    max-height: 88px; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 20px; border-top: 1px solid var(--c-border); background: var(--c-surface);
  }
  .c-bgbar__label { font-size: 12px; color: var(--c-fg-muted); }
  .c-bgchip {
    cursor: pointer; border: 1px solid var(--c-border); border-radius: 999px;
    background: var(--c-surface-2); color: var(--c-fg); font: inherit; font-size: 12px;
    padding: 4px 12px; display: inline-flex; align-items: center; gap: 7px;
  }
  .c-bgchip:hover { filter: brightness(1.15); }
  .c-bgchip:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
  .c-bgchip--active { border-color: var(--c-primary); box-shadow: 0 0 0 1px var(--c-primary) inset; }
  .c-bgchip__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-fg-muted); flex: none; }
  .c-bgchip--running .c-bgchip__dot { background: var(--c-primary); animation: c-blink 1.2s infinite; }
  .c-bgchip--done .c-bgchip__dot { background: var(--c-ok); }
  .c-bgchip--cancelled .c-bgchip__dot, .c-bgchip--cancelling .c-bgchip__dot { background: #d3a95c; }
  .c-bgchip--error .c-bgchip__dot { background: var(--c-error); }

  /* ============ 沙箱画面面板 ============ */
  .c-screen { display: flex; flex-direction: column; background: var(--c-bg); min-width: 0; }
  .c-screen__bar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--c-border); background: var(--c-surface);
  }
  .c-screen__title { font-size: 13px; font-weight: 600; }
  .c-screen__status { font-size: 12px; color: var(--c-fg-muted); margin-left: auto; }
  .c-screen__status--live::before { content: "●"; color: var(--c-ok); margin-right: 5px; }
  .c-screen__status--off::before { content: "●"; color: var(--c-error); margin-right: 5px; }
  .c-screen__view {
    flex: 1; overflow: auto; padding: 16px; display: grid; place-items: center;
    background: repeating-linear-gradient(45deg, #0c0e13, #0c0e13 12px, #0e1117 12px, #0e1117 24px);
  }
  .c-screen__img {
    max-width: 100%; height: auto; border-radius: var(--c-radius-sm);
    border: 1px solid var(--c-border); box-shadow: 0 10px 30px rgb(0 0 0 / .4);
    display: none;
  }
  .c-screen__placeholder { color: var(--c-fg-muted); font-size: 13px; text-align: center; max-width: 260px; }

  /* ============ 右侧选项卡面板 ============ */
  .c-panel { display: flex; flex-direction: column; background: var(--c-bg); min-width: 0; }
  .c-tabs {
    display: flex; gap: 2px; padding: 8px 8px 0;
    background: var(--c-surface); border-bottom: 1px solid var(--c-border);
  }
  .c-tabs__btn {
    appearance: none; border: 1px solid transparent; border-bottom: none;
    background: transparent; color: var(--c-fg-muted);
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 14px; cursor: pointer;
    border-radius: var(--c-radius-sm) var(--c-radius-sm) 0 0;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .c-tabs__btn:hover { color: var(--c-fg); background: var(--c-surface-2); }
  .c-tabs__btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: -2px; }
  .c-tabs__btn--active {
    color: var(--c-fg); background: var(--c-bg);
    border-color: var(--c-border); position: relative; top: 1px;
  }
  .c-tabs__badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--c-surface-2); color: var(--c-fg-muted);
    font-size: 11px; line-height: 18px; text-align: center;
  }
  .c-tabs__btn--active .c-tabs__badge { background: var(--c-primary); color: #fff; }

  .c-tabs__views { position: relative; flex: 1; min-height: 0; }
  .c-view { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  .c-view--active { display: flex; }

  /* 文件系统：目录树 */
  .c-files__bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--c-border); background: var(--c-surface);
  }
  .c-files__path { font-family: var(--c-mono); font-size: 12px; color: var(--c-fg-muted); word-break: break-all; }
  .c-files__body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px; }
  .c-files__empty { margin: auto; color: var(--c-fg-muted); font-size: 13px; text-align: center; padding: 20px; }
  .c-tree { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .c-tree ul { list-style: none; margin: 0; padding: 0; }
  .c-tree__row {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--c-fg);
    border: 1px solid transparent;
  }
  .c-tree__row:hover { background: var(--c-surface-2); }
  .c-tree__row:focus-visible { outline: 2px solid var(--c-primary); outline-offset: -2px; }
  .c-tree__row--active { background: var(--c-surface-2); border-color: var(--c-primary); }
  .c-tree__twist { width: 14px; flex: none; text-align: center; color: var(--c-fg-muted); font-size: 10px; user-select: none; }
  .c-tree__twist--spacer { visibility: hidden; }
  .c-tree__ico { flex: none; width: 16px; text-align: center; }
  .c-tree__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-tree__size { font-family: var(--c-mono); font-size: 11px; color: var(--c-fg-muted); flex: none; }
  .c-tree__children { margin-left: 0; border-left: 1px solid var(--c-border); }
  .c-tree__hint { padding: 3px 8px 3px 28px; color: var(--c-fg-muted); font-size: 12px; }

  /* 文件查看器 */
  .c-viewer { flex: none; display: none; flex-direction: column; min-height: 0; border-top: 1px solid var(--c-border); background: var(--c-bg); }
  .c-viewer--open { display: flex; height: 62%; }
  .c-viewer__head {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 6px 12px; background: var(--c-surface); border-bottom: 1px solid var(--c-border);
    font-size: 12px; color: var(--c-fg-muted);
  }
  .c-viewer__name { font-weight: 600; color: var(--c-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-viewer__lang { font-family: var(--c-mono); padding: 1px 8px; border-radius: 999px; background: var(--c-surface-2); color: var(--c-fg-muted); }
  .c-viewer__head .c-btn { height: 24px; padding: 2px 10px; font-size: 12px; margin-left: 8px; }
  .c-viewer__head .c-btn:last-child { margin-left: 6px; }
  .c-viewer__body { flex: 1; min-height: 0; overflow: auto; }

  /* 代码高亮 */
  .c-code { margin: 0; padding: 12px 14px; font-family: var(--c-mono); font-size: 12px; line-height: 1.65; white-space: pre; tab-size: 2; color: #d7dce6; }
  .tk-kw { color: #c792ea; font-weight: 600; }
  .tk-str { color: #a5d6a7; }
  .tk-num { color: #f6b26b; }
  .tk-com { color: #6b7688; font-style: italic; }
  .tk-fn { color: #82aaff; }
  .tk-typ { color: #ffcb6b; }
  .c-preview__text { margin: 0; padding: 12px 14px; font-family: var(--c-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--c-fg); }
  .c-preview__err { padding: 16px; color: #ffb3b5; font-size: 13px; }
  .c-preview__frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }

  /* Markdown 富文本 */
  .c-md { padding: 16px 20px; max-width: 100%; color: var(--c-fg); line-height: 1.7; word-break: break-word; }
  .c-md__h { margin: 18px 0 10px; line-height: 1.35; font-weight: 700; }
  .c-md h1.c-md__h { font-size: 24px; border-bottom: 1px solid var(--c-border); padding-bottom: 6px; }
  .c-md h2.c-md__h { font-size: 20px; } .c-md h3.c-md__h { font-size: 17px; }
  .c-md h4.c-md__h, .c-md h5.c-md__h, .c-md h6.c-md__h { font-size: 15px; }
  .c-md__p { margin: 10px 0; }
  .c-md a { color: var(--c-primary); text-decoration: none; } .c-md a:hover { text-decoration: underline; }
  .c-md__list { margin: 10px 0; padding-left: 24px; } .c-md__list li { margin: 4px 0; }
  .c-md__quote { margin: 12px 0; padding: 6px 14px; border-left: 3px solid var(--c-primary); background: var(--c-surface); color: var(--c-fg-muted); }
  .c-md__hr { border: 0; border-top: 1px solid var(--c-border); margin: 16px 0; }
  .c-md code { font-family: var(--c-mono); font-size: 12px; background: var(--c-surface-2); padding: 1px 5px; border-radius: 4px; }
  .c-md__pre { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--c-radius-sm); overflow: auto; margin: 12px 0; }
  .c-md__pre code { background: none; padding: 0; }
  .c-md__tablewrap { overflow-x: auto; margin: 12px 0; }
  .c-md__table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .c-md__table th, .c-md__table td { border: 1px solid var(--c-border); padding: 6px 10px; text-align: left; }
  .c-md__table th { background: var(--c-surface-2); }
  .c-md img { max-width: 100%; border-radius: var(--c-radius-sm); }

  /* 日志追踪 */
  .c-logs__bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--c-border); background: var(--c-surface);
  }
  .c-logs__bar .c-btn { height: 28px; padding: 3px 12px; font-size: 12px; margin-left: auto; }
  .c-logs__list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px; font-family: var(--c-mono); font-size: 12px; }
  .c-log { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.05); }
  .c-log__time { color: var(--c-fg-muted); flex: none; }
  .c-log__tag { flex: none; font-weight: 700; }
  .c-log__tag--send { color: var(--c-primary); }
  .c-log__tag--ai { color: var(--c-ok); }
  .c-log__tag--tool { color: #d3a95c; }
  .c-log__tag--result { color: #9a7fd6; }
  .c-log__tag--error { color: var(--c-error); }
  .c-log__msg { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; color: var(--c-fg); }
  .c-logs__empty { margin: auto; color: var(--c-fg-muted); font-size: 13px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div class="c-app">
  <header class="c-app__header">
    <div class="c-app__logo" aria-hidden="true">AI</div>
    <h1 class="c-app__title">AIO Sandbox · DeepAgents 交互界面</h1>
    <span class="c-app__meta" id="sandboxMeta">sandbox: -</span>
    <span class="c-app__meta" id="sessionMeta" title="当前会话 id：同一会话内多轮对话共享上下文">会话 -</span>
  </header>

  <div class="c-app__body">
    <!-- 左：聊天 -->
    <section class="c-chat" aria-label="对话">
      <div class="c-chat__log" id="log">
        <div class="c-empty">
          <div class="c-empty__title">向 Agent 提问</div>
          <div>输入任务，右侧实时查看沙箱浏览器画面。示例：直接留空发送即可运行默认市场调研任务。</div>
        </div>
      </div>
      <div class="c-bgbar" id="bgbar" hidden></div>
      <form class="c-composer" id="composer">
        <textarea
          class="c-composer__input" id="input" rows="1"
          placeholder="描述你要 Agent 完成的任务… (Enter 发送 / Shift+Enter 换行)"
          aria-label="消息输入"></textarea>
        <div class="c-composer__actions">
          <button class="c-btn c-btn--ghost" id="newSession" type="button" title="清空对话并开启新会话（不再携带之前的上下文）">新会话</button>
          <button class="c-btn" id="send" type="submit">发送</button>
          <button class="c-btn c-btn--danger" id="stop" type="button" disabled title="打断当前任务">停止</button>
          <button class="c-btn c-btn--ghost" id="background" type="button" disabled title="转入后台继续运行">后台执行</button>
        </div>
      </form>
    </section>

    <div class="c-splitter" id="splitter" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="拖拽调整左右栏宽度（双击复位）" title="拖拽调整宽度 · 双击复位"></div>

    <!-- 右：多标签面板 -->
    <aside class="c-panel" aria-label="沙箱面板">
      <div class="c-tabs" role="tablist">
        <button class="c-tabs__btn c-tabs__btn--active" id="tab-browser" role="tab" aria-selected="true" aria-controls="view-browser" type="button">🌐 浏览器</button>
        <button class="c-tabs__btn" id="tab-files" role="tab" aria-selected="false" aria-controls="view-files" type="button">📁 文件系统 <span class="c-tabs__badge" id="filesBadge">0</span></button>
        <button class="c-tabs__btn" id="tab-logs" role="tab" aria-selected="false" aria-controls="view-logs" type="button">📜 日志追踪 <span class="c-tabs__badge" id="logsBadge">0</span></button>
      </div>

      <div class="c-tabs__views">
        <!-- 浏览器 -->
        <section class="c-screen c-view c-view--active" id="view-browser" role="tabpanel" aria-labelledby="tab-browser">
          <div class="c-screen__bar">
            <span class="c-screen__title">沙箱浏览器画面</span>
            <span class="c-screen__status c-screen__status--off" id="screenStatus">未连接</span>
            <button class="c-btn c-btn--ghost" id="toggleScreen" type="button" aria-pressed="false" style="height:32px;padding:6px 12px;font-size:12px">开始</button>
          </div>
          <div class="c-screen__view">
            <img class="c-screen__img" id="screenImg" alt="沙箱浏览器截图" />
            <div class="c-screen__placeholder" id="screenPlaceholder">
              点击「开始」实时回显沙箱内浏览器 / 桌面画面。
            </div>
          </div>
        </section>

        <!-- 文件系统 -->
        <section class="c-files c-view" id="view-files" role="tabpanel" aria-labelledby="tab-files" hidden>
          <div class="c-files__bar">
            <span class="c-files__path" id="filesPath">/home/gem</span>
            <button class="c-btn c-btn--ghost" id="filesCollapse" type="button" title="折叠全部" style="height:28px;padding:3px 10px;font-size:12px;margin-left:auto">折叠</button>
            <button class="c-btn c-btn--ghost" id="filesRefresh" type="button" style="height:28px;padding:3px 12px;font-size:12px">刷新</button>
          </div>
          <div class="c-files__body" id="filesTree">
            <div class="c-files__empty">加载中…</div>
          </div>
          <div class="c-viewer" id="fileViewer">
            <div class="c-viewer__head">
              <span class="c-viewer__name" id="viewerName">-</span>
              <span class="c-viewer__lang" id="viewerLang"></span>
              <button class="c-btn c-btn--ghost" id="viewerToggle" type="button" hidden>源码</button>
              <button class="c-btn c-btn--ghost" id="viewerOpen" type="button" title="用沙箱桌面浏览器打开（也可双击文件）" style="margin-left:auto">🖥 沙箱打开</button>
              <button class="c-btn c-btn--ghost" id="viewerClose" type="button">✕ 关闭</button>
            </div>
            <div class="c-viewer__body" id="viewerBody"></div>
          </div>
        </section>

        <!-- 日志追踪 -->
        <section class="c-logs c-view" id="view-logs" role="tabpanel" aria-labelledby="tab-logs" hidden>
          <div class="c-logs__bar">
            <span class="c-files__path">Agent 执行事件流</span>
            <button class="c-btn c-btn--ghost" id="logsClear" type="button">清空</button>
          </div>
          <div class="c-logs__list" id="logsList">
            <div class="c-logs__empty">发送任务后，这里会按时间记录每一步调用与返回。</div>
          </div>
        </section>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
  "use strict";
  const log = document.getElementById("log");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const empty = log.querySelector(".c-empty");

  // ---- 会话：同一 session 内多轮对话共享上下文（服务端 LangGraph thread）----
  let SESSION_ID = "-";
  fetch("/api/config").then(r => r.json()).then(c => {
    const meta = document.getElementById("sandboxMeta");
    SESSION_ID = c.session_id || SESSION_ID;
    if (c.mode === "local") {
      meta.textContent = "⚠ 本地模式（沙箱不可达）· 工作目录: " + (c.working_dir || "-");
      // 本地模式无沙箱桌面，禁用浏览器画面回显
      const btn = document.getElementById("toggleScreen");
      if (btn) { btn.disabled = true; btn.textContent = "不可用"; }
      const ph = document.getElementById("screenPlaceholder");
      if (ph) ph.textContent = "当前为本地模式，无沙箱浏览器画面回显。";
    } else {
      meta.textContent = "sandbox: " + c.sandbox_url + " · 沙箱模式";
    }
    const sEl = document.getElementById("sessionMeta");
    if (sEl) sEl.textContent = "会话 " + SESSION_ID;
  }).catch(() => {});

  // ---- 渲染辅助 ----
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clearEmpty() { if (empty && empty.parentNode) empty.remove(); }
  function scrollBottom() { log.scrollTop = log.scrollHeight; }

  function addUser(text) {
    if (!text) return;   // 回放空消息时跳过，避免空气泡
    clearEmpty();
    const m = el("div", "c-msg c-msg--user");
    m.appendChild(el("div", "c-msg__role", "你"));
    m.appendChild(el("div", null, text));
    log.appendChild(m); scrollBottom();
  }
  function addAssistant(text) {
    if (!text) return;
    const m = el("div", "c-msg c-msg--assistant");
    m.appendChild(el("div", "c-msg__role", "Agent"));
    m.appendChild(el("div", null, text));
    log.appendChild(m); scrollBottom();
  }
  function addToolCall(name, args) {
    const wrap = el("div", "c-step");
    const chip = el("span", "c-chip");
    chip.appendChild(el("span", "c-chip__dot"));
    chip.appendChild(el("span", null, "调用工具 · " + name));
    wrap.appendChild(chip);
    try {
      const d = el("details", "c-detail");
      d.appendChild(el("summary", null, "参数 args"));
      d.appendChild(el("pre", "c-detail__body", JSON.stringify(args, null, 2)));
      wrap.appendChild(d);
    } catch (e) {}
    log.appendChild(wrap); scrollBottom();
  }
  function addToolResult(name, content) {
    const wrap = el("div", "c-step");
    const chip = el("span", "c-chip c-chip--result");
    chip.appendChild(el("span", "c-chip__dot"));
    chip.appendChild(el("span", null, "工具返回 · " + name));
    wrap.appendChild(chip);
    const d = el("details", "c-detail");
    const preview = (content || "").length > 400 ? content.slice(0, 400) + " …" : content;
    d.appendChild(el("summary", null, "查看输出 (" + (content || "").length + " 字符)"));
    d.appendChild(el("pre", "c-detail__body", preview));
    wrap.appendChild(d);
    log.appendChild(wrap); scrollBottom();
  }
  function addError(text) {
    const m = el("div", "c-msg c-msg--error");
    m.appendChild(el("div", "c-msg__role", "错误"));
    m.appendChild(el("div", null, text));
    log.appendChild(m); scrollBottom();
  }
  function addSystem(text) {
    clearEmpty();
    const m = el("div", "c-msg c-msg--system");
    m.appendChild(el("div", "c-msg__role", "系统"));
    m.appendChild(el("div", null, text));
    log.appendChild(m); scrollBottom();
  }

  let typingEl = null;
  function showTyping() {
    typingEl = el("div", "c-typing");
    typingEl.append(el("span"), el("span"), el("span"));
    log.appendChild(typingEl); scrollBottom();
  }
  function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

  // ---- 处理一条 SSE 事件 ----
  function handleEvent(data) {
    let obj; try { obj = JSON.parse(data); } catch (e) { return; }
    hideTyping();  // 真实内容到达即收起打字指示
    if (obj.role === "user") {
      addUser(obj.content);
      pushLog("send", "发送", obj.content);
    } else if (obj.role === "assistant") {
      addAssistant(obj.content);
      if (obj.content) pushLog("ai", "Agent", obj.content);
      (obj.tool_calls || []).forEach(tc => {
        addToolCall(tc.name, tc.args);
        pushLog("tool", "调用 " + tc.name, summarizeArgs(tc.args));
      });
    } else if (obj.role === "tool") {
      addToolResult(obj.name, obj.content);
      pushLog("result", "返回 " + obj.name, (obj.content || "").slice(0, 300));
    } else if (obj.role === "system") {
      addSystem(obj.content);
      pushLog("ai", "系统", obj.content);
    } else if (obj.role === "error") {
      addError(obj.content);
      pushLog("error", "错误", obj.content);
    }
  }

  // ================= 运行管理：前台/后台/停止 =================
  const stopBtn = document.getElementById("stop");
  const bgBtn = document.getElementById("background");
  const bgbar = document.getElementById("bgbar");
  let DEFAULT_TASK = "";
  fetch("/api/config").then(r => r.json()).then(c => { DEFAULT_TASK = c.default_task || ""; }).catch(() => {});

  let currentRunId = null;
  let es = null;         // EventSource
  let attached = false;  // 是否有前台连接的运行

  function setRunningUI(on) {
    attached = on;
    stopBtn.disabled = !on;
    bgBtn.disabled = !on;
    sendBtn.textContent = on ? "运行中…" : "发送";
  }

  // 断开当前连接（不会停止后台任务）
  function detach() {
    if (es) { es.close(); es = null; }
    hideTyping();
    setRunningUI(false);
  }

  // 连接到某个 run：会话内追加到现有记录，再回放该 run 的事件
  function attach(runId) {
    if (runId === currentRunId && es) return;  // 重复点击同一芯片不重连
    detach();
    currentRunId = runId;
    if (log.querySelector(".c-msg")) {
      addSystemNote("↩ 回到任务 " + runId + "（事件从头回放）");
    }
    showTyping();
    setRunningUI(true);
    es = new EventSource("/api/runs/" + runId + "/stream");
    es.onmessage = (e) => handleEvent(e.data);
    es.addEventListener("end", (e) => {
      let st = "done"; try { st = JSON.parse(e.data).status; } catch (_) {}
      finishRun(st);
    });
    es.onerror = () => { /* 结束后服务端会关闭；重连由事件回放兼容 */ };
  }

  function finishRun(status) {
    detach();
    currentRunId = null;
    if (status === "cancelled") addSystemNote("⏹ 任务已打断（已停止）");
    else if (status === "done") addSystemNote("✅ 任务完成");
    refreshFiles();
    pollRuns();
  }

  async function startRun(text) {
    const msg = (text || "").trim() || DEFAULT_TASK;
    if (attached) { detach(); pollRuns(); }  // 旧任务自动转入后台
    try {
      const r = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, session_id: SESSION_ID }),
      });
      if (!r.ok) { addError("启动失败：HTTP " + r.status); setRunningUI(false); return; }
      const { run_id } = await r.json();
      input.value = ""; autoResize();
      attach(run_id);
      pollRuns();
    } catch (e) {
      addError(String(e)); setRunningUI(false);
    }
  }

  async function stopCurrent() {
    if (!currentRunId) return;
    stopBtn.disabled = true;
    try { await fetch("/api/runs/" + currentRunId + "/stop", { method: "POST" }); }
    catch (_) { stopBtn.disabled = false; }
    // 服务端会推送 end(cancelled) → finishRun 收尾
  }

  function toBackground() {
    if (!currentRunId) return;
    const id = currentRunId;
    detach();
    currentRunId = null;
    addSystemNote("↪ 任务 " + id + " 已转入后台继续运行（点下方芯片可回到前台）");
    pollRuns();
  }

  function addSystemNote(text) {
    const m = el("div", "c-msg c-msg--assistant");
    m.appendChild(el("div", "c-msg__role", "系统"));
    m.appendChild(el("div", null, text));
    log.appendChild(m); scrollBottom();
  }

  // ---- 后台任务芯片 ----
  function statusLabel(s) {
    return { running: "运行中", cancelling: "停止中", cancelled: "已停止", done: "完成", error: "错误" }[s] || s;
  }
  async function pollRuns() {
    try {
      const r = await fetch("/api/runs");
      if (!r.ok) return;
      renderChips((await r.json()).runs || []);
    } catch (_) {}
  }
  function renderChips(runs) {
    if (!runs.length) { bgbar.hidden = true; bgbar.innerHTML = ""; return; }
    bgbar.hidden = false;
    bgbar.innerHTML = "";
    bgbar.appendChild(el("span", "c-bgbar__label", "任务："));
    runs.forEach(run => {
      const chip = el("button", "c-bgchip c-bgchip--" + run.status + (run.id === currentRunId ? " c-bgchip--active" : ""));
      chip.type = "button";
      chip.title = run.message;
      chip.appendChild(el("span", "c-bgchip__dot"));
      chip.appendChild(el("span", null, run.id + " · " + statusLabel(run.status)));
      chip.addEventListener("click", () => attach(run.id));
      bgbar.appendChild(chip);
    });
  }
  setInterval(pollRuns, 2500);

  stopBtn.addEventListener("click", stopCurrent);
  bgBtn.addEventListener("click", toBackground);

  // ---- 输入框交互 ----
  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoResize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    startRun(input.value.trim());
  });

  // ---- 新会话：重置服务端 thread 并清空聊天区 ----
  const EMPTY_HTML =
    '<div class="c-empty">' +
    '<div class="c-empty__title">向 Agent 提问</div>' +
    "<div>输入任务，右侧实时查看沙箱浏览器画面。同一会话内多轮对话共享上下文；示例：直接留空发送即可运行默认市场调研任务。</div></div>";
  document.getElementById("newSession").addEventListener("click", async () => {
    if (attached) addSystemNote("请先停止或将当前任务转入后台，再开启新会话");
    if (currentRunId) { detach(); currentRunId = null; pollRuns(); }
    try {
      const r = await fetch("/api/session/new", { method: "POST" });
      if (r.ok) SESSION_ID = (await r.json()).session_id || SESSION_ID;
    } catch (_) {}
    log.innerHTML = EMPTY_HTML;
    const sEl = document.getElementById("sessionMeta");
    if (sEl) sEl.textContent = "会话 " + SESSION_ID;
    addSystemNote("✨ 已开启新会话，不再携带之前的对话上下文");
  });

  // ---- 沙箱画面轮询 ----
  const img = document.getElementById("screenImg");
  const ph = document.getElementById("screenPlaceholder");
  const statusEl = document.getElementById("screenStatus");
  const toggleBtn = document.getElementById("toggleScreen");
  let screenTimer = null, screenOn = false;

  async function pullFrame() {
    try {
      const r = await fetch("/api/screenshot?ts=" + Date.now());
      if (!r.ok) throw new Error("HTTP " + r.status);
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      img.src = url; img.style.display = "block"; ph.style.display = "none";
      statusEl.textContent = "实时"; statusEl.className = "c-screen__status c-screen__status--live";
    } catch (e) {
      statusEl.textContent = "不可用: " + e.message;
      statusEl.className = "c-screen__status c-screen__status--off";
      if (!img.src) { ph.style.display = "block"; }
    }
  }
  function startScreen() {
    if (screenOn) return;
    screenOn = true; pullFrame();
    screenTimer = setInterval(pullFrame, 2500);
    toggleBtn.textContent = "暂停"; toggleBtn.setAttribute("aria-pressed", "true");
  }
  function stopScreen() {
    screenOn = false; if (screenTimer) clearInterval(screenTimer); screenTimer = null;
    toggleBtn.textContent = "开始"; toggleBtn.setAttribute("aria-pressed", "false");
    statusEl.textContent = "已暂停"; statusEl.className = "c-screen__status c-screen__status--off";
  }
  toggleBtn.addEventListener("click", () => { screenOn ? stopScreen() : startScreen(); });

  // ================= 选项卡切换 =================
  const tabs = {
    browser: { btn: document.getElementById("tab-browser"), view: document.getElementById("view-browser") },
    files:   { btn: document.getElementById("tab-files"),   view: document.getElementById("view-files") },
    logs:    { btn: document.getElementById("tab-logs"),    view: document.getElementById("view-logs") },
  };
  function activateTab(name) {
    Object.entries(tabs).forEach(([key, t]) => {
      const on = key === name;
      t.btn.classList.toggle("c-tabs__btn--active", on);
      t.btn.setAttribute("aria-selected", on ? "true" : "false");
      t.view.classList.toggle("c-view--active", on);
      t.view.hidden = !on;
    });
    if (name === "files") refreshFiles();
  }
  Object.values(tabs).forEach((t, i) => {
    t.btn.addEventListener("click", () => activateTab(["browser", "files", "logs"][i]));
  });

  // ================= 日志追踪 =================
  const logsList = document.getElementById("logsList");
  const logsBadge = document.getElementById("logsBadge");
  let logCount = 0;
  function summarizeArgs(args) {
    try {
      if (args && typeof args === "object") {
        const cmd = args.command || args.file_path || args.path || args.pattern;
        if (cmd) return String(cmd).slice(0, 200);
      }
      return JSON.stringify(args).slice(0, 200);
    } catch (e) { return ""; }
  }
  function pushLog(kind, tag, text) {
    if (logCount === 0) logsList.innerHTML = "";
    logCount++;
    logsBadge.textContent = logCount;
    const t = new Date().toTimeString().slice(0, 8);
    const row = el("div", "c-log");
    row.appendChild(el("span", "c-log__time", t));
    row.appendChild(el("span", "c-log__tag c-log__tag--" + kind, tag));
    row.appendChild(el("span", "c-log__msg", text || ""));
    logsList.appendChild(row);
    logsList.scrollTop = logsList.scrollHeight;
  }
  document.getElementById("logsClear").addEventListener("click", () => {
    logCount = 0; logsBadge.textContent = "0";
    logsList.innerHTML = '<div class="c-logs__empty">日志已清空。</div>';
  });

  // ================= 文件系统：目录树 + 查看器 =================
  const filesPath = document.getElementById("filesPath");
  const filesBadge = document.getElementById("filesBadge");
  const filesTree = document.getElementById("filesTree");
  const viewer = document.getElementById("fileViewer");
  const viewerName = document.getElementById("viewerName");
  const viewerLang = document.getElementById("viewerLang");
  const viewerToggle = document.getElementById("viewerToggle");
  const viewerBody = document.getElementById("viewerBody");
  const ROOT_PATH = "/home/gem";
  let currentFile = null;   // {name, path, content, kind, lang, error}
  let richMode = true;

  function fmtSize(n) {
    if (n == null) return "-";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " K";
    return (n / 1048576).toFixed(1) + " M";
  }
  function extOf(name) { const i = name.lastIndexOf("."); return i < 0 ? "" : name.slice(i + 1).toLowerCase(); }
  const CODE_LANGS = { js:"js", jsx:"js", mjs:"js", cjs:"js", ts:"js", tsx:"js", json:"json", py:"python", sh:"bash", bash:"bash", zsh:"bash", css:"css", scss:"css", c:"c", h:"c", cpp:"c", cc:"c", hpp:"c", go:"go", rs:"c", java:"c", sql:"c", yml:"yaml", yaml:"yaml", toml:"ini", ini:"ini", env:"ini", conf:"ini" };
  function kindOf(name) {
    const e = extOf(name);
    if (e === "md" || e === "markdown") return "markdown";
    if (e === "html" || e === "htm") return "html";
    if (e === "" || e === "txt" || e === "log") return "text";
    return "code";
  }
  function langOf(name) { return CODE_LANGS[extOf(name)] || "text"; }
  function iconFor(name) {
    return { md:"📝", markdown:"📝", html:"🌐", htm:"🌐", py:"🐍", js:"🟨", ts:"🔷", json:"🧩", sh:"💻", css:"🎨", log:"📜", txt:"📄" }[extOf(name)] || "📄";
  }

  // ---- 轻量语法高亮（无依赖）----
  const KEYWORDS = {
    python: "False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield self",
    js: "const let var function return if else for while do switch case break continue new this class extends import export from default async await try catch finally throw typeof instanceof null undefined true false of in yield static super delete get set",
    json: "true false null",
    bash: "if then else elif fi for while until do done case esac function return break continue export local readonly source alias set unset shift echo cd ls rm cp mv mkdir",
    c: "int char float double void struct union enum const static return if else for while switch case break continue typedef unsigned signed long short sizeof include define",
    go: "func package import return if else for range var const type struct interface map chan go defer nil true false string int error",
    css: "important media keyframes", yaml: "true false null", ini: "true false", text: "", html: "",
  };
  function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function highlight(code, lang) {
    lang = lang || "text";
    const kw = new Set((KEYWORDS[lang] || "").split(/\s+/).filter(Boolean));
    const jsLike = ["js", "c", "css", "go", "json", "html"].indexOf(lang) >= 0;
    const lineComment = (lang === "python" || lang === "bash" || lang === "yaml" || lang === "ini") ? "#" : (jsLike ? "//" : null);
    const out = []; let i = 0; const n = code.length;
    const put = (cls, txt) => out.push(cls ? '<span class="tk-' + cls + '">' + escapeHtml(txt) + "</span>" : escapeHtml(txt));
    while (i < n) {
      const ch = code[i];
      if (jsLike && ch === "/" && code[i + 1] === "*") { let j = code.indexOf("*/", i + 2); j = j < 0 ? n : j + 2; put("com", code.slice(i, j)); i = j; continue; }
      if (lineComment && code.startsWith(lineComment, i)) { let j = code.indexOf("\n", i); j = j < 0 ? n : j; put("com", code.slice(i, j)); i = j; continue; }
      if (ch === '"' || ch === "'" || ch === "`") { let j = i + 1; while (j < n) { if (code[j] === "\\") { j += 2; continue; } if (code[j] === ch) { j++; break; } j++; } put("str", code.slice(i, j)); i = j; continue; }
      if (ch >= "0" && ch <= "9") { let j = i; while (j < n && /[0-9a-fA-FxX._]/.test(code[j])) j++; put("num", code.slice(i, j)); i = j; continue; }
      if (/[A-Za-z_$]/.test(ch)) { let j = i; while (j < n && /[\w$]/.test(code[j])) j++; const w = code.slice(i, j);
        if (kw.has(w)) put("kw", w);
        else if (code[j] === "(") put("fn", w);
        else if (/^[A-Z]/.test(w)) put("typ", w);
        else out.push(escapeHtml(w));
        i = j; continue; }
      put(null, ch); i++;
    }
    return out.join("");
  }

  // ---- 轻量 Markdown 渲染（无依赖）----
  function mdInline(s) {
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g, (m, c) => "<code>" + c + "</code>");
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (m, a, u) => '<img alt="' + a + '" src="' + u + '">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + "</a>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    return s;
  }
  function splitRow(line) { return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(s => s.trim()); }
  function mdToHtml(md) {
    const lines = String(md).replace(/\r\n?/g, "\n").split("\n");
    let html = "", i = 0;
    const blank = x => /^\s*$/.test(x);
    while (i < lines.length) {
      const line = lines[i];
      const fence = /^```(\w*)\s*$/.exec(line);
      if (fence) { const lang = fence[1]; const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; } i++;
        html += '<pre class="c-md__pre"><code>' + highlight(buf.join("\n"), lang || "text") + "</code></pre>"; continue; }
      const h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { const lv = h[1].length; html += "<h" + lv + ' class="c-md__h">' + mdInline(h[2]) + "</h" + lv + ">"; i++; continue; }
      if (/^\s*([-*_])\1\1[\s\-*_]*$/.test(line)) { html += '<hr class="c-md__hr">'; i++; continue; }
      if (/^>\s?/.test(line)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
        html += '<blockquote class="c-md__quote">' + mdToHtml(buf.join("\n")) + "</blockquote>"; continue; }
      if (line.indexOf("|") >= 0 && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf("-") >= 0) {
        const head = splitRow(line); i += 2; const body = [];
        while (i < lines.length && lines[i].indexOf("|") >= 0 && !blank(lines[i])) { body.push(splitRow(lines[i])); i++; }
        html += '<div class="c-md__tablewrap"><table class="c-md__table"><thead><tr>' + head.map(c => "<th>" + mdInline(c) + "</th>").join("") + "</tr></thead><tbody>" +
          body.map(r => "<tr>" + r.map(c => "<td>" + mdInline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>"; continue; }
      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) { const ordered = /^\s*\d+\.\s+/.test(line); const items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "")); i++;
          while (i < lines.length && !blank(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !/^```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])) { items[items.length - 1] += " " + lines[i]; i++; } }
        const tag = ordered ? "ol" : "ul";
        html += "<" + tag + ' class="c-md__list">' + items.map(t => "<li>" + mdInline(t) + "</li>").join("") + "</" + tag + ">"; continue; }
      if (blank(line)) { i++; continue; }
      const buf = [line]; i++;
      while (i < lines.length && !blank(lines[i]) && !/^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s)/.test(lines[i])) { buf.push(lines[i]); i++; }
      html += '<p class="c-md__p">' + mdInline(buf.join(" ")) + "</p>";
    }
    return html;
  }

  // ---- 目录树 ----
  async function listDir(path) {
    const r = await fetch("/api/files?path=" + encodeURIComponent(path));
    if (!r.ok) throw new Error("HTTP " + r.status);
    return (await r.json()).files || [];
  }
  function makeRow(f) {
    const row = el("div", "c-tree__row");
    row.tabIndex = 0;
    if (f.is_dir) {
      row.appendChild(el("span", "c-tree__twist", "▸"));
      row.appendChild(el("span", "c-tree__ico", "📁"));
      row.appendChild(el("span", "c-tree__name", f.name));
    } else {
      row.appendChild(el("span", "c-tree__twist c-tree__twist--spacer", "•"));
      row.appendChild(el("span", "c-tree__ico", iconFor(f.name)));
      row.appendChild(el("span", "c-tree__name", f.name));
      row.appendChild(el("span", "c-tree__size", fmtSize(f.size)));
    }
    return row;
  }
  function buildTree(files, container) {
    container.innerHTML = "";
    files.forEach(f => {
      const li = el("li");
      const row = makeRow(f);
      li.appendChild(row);
      if (f.is_dir) {
        const child = el("ul", "c-tree__children"); child.hidden = true; child.style.marginLeft = "14px";
        li.appendChild(child);
        let loaded = false;
        const toggle = async () => {
          const tw = row.querySelector(".c-tree__twist");
          if (child.hidden) {
            if (!loaded) { tw.textContent = "…"; try { const ch = await listDir(f.path); buildTree(ch, child); loaded = true; if (!ch.length) child.appendChild(el("li", "c-tree__hint", "（空目录）")); } catch (e) { tw.textContent = "▸"; return; } }
            child.hidden = false; tw.textContent = "▾";
          } else { child.hidden = true; tw.textContent = "▸"; }
        };
        row.addEventListener("click", toggle);
        row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      } else {
        row.setAttribute("role", "button");
        row.title = "单击预览 · 双击用沙箱打开";
        const open = () => { setActiveRow(row); openFile(f); };
        row.addEventListener("click", open);
        row.addEventListener("dblclick", () => openInSandbox(f.path, f.name));
        row.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
      }
      container.appendChild(li);
    });
  }
  function setActiveRow(row) {
    filesTree.querySelectorAll(".c-tree__row--active").forEach(r => r.classList.remove("c-tree__row--active"));
    row.classList.add("c-tree__row--active");
  }
  async function refreshFiles() {
    filesPath.textContent = ROOT_PATH;
    try {
      const files = await listDir(ROOT_PATH);
      filesBadge.textContent = files.length;
      const ul = el("ul", "c-tree");
      filesTree.innerHTML = ""; filesTree.appendChild(ul);
      if (!files.length) { filesTree.appendChild(el("div", "c-files__empty", "目录为空（只显示非隐藏产物）")); return; }
      buildTree(files, ul);
    } catch (e) {
      filesTree.innerHTML = ""; filesTree.appendChild(el("div", "c-files__empty", "读取失败：" + e.message));
    }
  }

  // ---- 文件查看器 ----
  async function openFile(f) {
    currentFile = { name: f.name, path: f.path, content: "", kind: kindOf(f.name), lang: langOf(f.name), error: null };
    richMode = true;
    viewerName.textContent = f.name;
    viewerLang.textContent = currentFile.kind === "markdown" ? "markdown" : (currentFile.kind === "html" ? "html" : currentFile.lang);
    viewerToggle.hidden = !(currentFile.kind === "markdown" || currentFile.kind === "html");
    viewerToggle.textContent = "源码";
    viewer.classList.add("c-viewer--open");
    viewerBody.innerHTML = '<div class="c-files__empty">加载中…</div>';
    try {
      const r = await fetch("/api/file?path=" + encodeURIComponent(f.path));
      if (!r.ok) throw new Error("HTTP " + r.status);
      currentFile.content = ((await r.json()).content || "");
    } catch (e) { currentFile.error = "无法读取：" + e.message; }
    drawViewer();
  }
  function codeNode(text, lang) {
    const pre = el("pre", "c-code"); const code = document.createElement("code"); code.innerHTML = highlight(text || "", lang); pre.appendChild(code); return pre;
  }
  function drawViewer() {
    viewerBody.innerHTML = "";
    if (!currentFile) return;
    if (currentFile.error) { viewerBody.appendChild(el("div", "c-preview__err", currentFile.error)); return; }
    const src = currentFile.content || "";
    if (currentFile.kind === "markdown") {
      if (richMode) { const d = el("div", "c-md"); d.innerHTML = mdToHtml(src); viewerBody.appendChild(d); }
      else viewerBody.appendChild(codeNode(src, "text"));
    } else if (currentFile.kind === "html") {
      if (richMode) { const ifr = document.createElement("iframe"); ifr.className = "c-preview__frame"; ifr.setAttribute("sandbox", ""); ifr.srcdoc = src || "<p style='font-family:sans-serif;color:#999'>（空文件）</p>"; viewerBody.appendChild(ifr); }
      else viewerBody.appendChild(codeNode(src, "html"));
    } else if (currentFile.kind === "code") {
      viewerBody.appendChild(codeNode(src, currentFile.lang));
    } else {
      viewerBody.appendChild(el("pre", "c-preview__text", src || "（空文件）"));
    }
  }
  viewerToggle.addEventListener("click", () => { richMode = !richMode; viewerToggle.textContent = richMode ? "源码" : "渲染"; drawViewer(); });
  function closeViewer() { viewer.classList.remove("c-viewer--open"); currentFile = null; filesTree.querySelectorAll(".c-tree__row--active").forEach(r => r.classList.remove("c-tree__row--active")); }
  document.getElementById("viewerClose").addEventListener("click", closeViewer);
  document.getElementById("filesRefresh").addEventListener("click", refreshFiles);
  document.getElementById("filesCollapse").addEventListener("click", () => {
    filesTree.querySelectorAll("ul.c-tree__children").forEach(u => u.hidden = true);
    filesTree.querySelectorAll(".c-tree__twist").forEach(t => { if (t.textContent === "▾") t.textContent = "▸"; });
  });
  // ---- 用沙箱桌面浏览器打开文件（结果在「浏览器」标签回显） ----
  async function openInSandbox(path, name) {
    const btn = document.getElementById("viewerOpen");
    if (btn) { btn.disabled = true; btn.textContent = "打开中…"; }
    try {
      const r = await fetch("/api/open", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((d && d.detail) || ("HTTP " + r.status));
      activateTab("browser");
      if (!screenOn) startScreen();
      statusEl.textContent = "🖥 已打开 " + (name || "");
      statusEl.className = "c-screen__status c-screen__status--live";
    } catch (e) {
      addError("沙箱打开失败：" + e.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "🖥 沙箱打开"; }
    }
  }
  document.getElementById("viewerOpen").addEventListener("click", () => {
    if (currentFile) openInSandbox(currentFile.path, currentFile.name);
  });

  // ---- 左右栏拖拽调宽 ----
  (function initSplitter() {
    const body = document.querySelector(".c-app__body");
    const splitter = document.getElementById("splitter");
    if (!body || !splitter) return;
    const KEY = "panelWidth", DEF = 460, MIN = 300;
    function setWidth(px) {
      const max = Math.max(MIN, Math.floor(window.innerWidth * 0.72));
      px = Math.max(MIN, Math.min(max, Math.round(px)));
      body.style.setProperty("--panel-w", px + "px");
      try { localStorage.setItem(KEY, px); } catch (e) {}
      return px;
    }
    function currentWidth() {
      const v = getComputedStyle(body).getPropertyValue("--panel-w");
      const n = parseInt(v);
      return isNaN(n) ? DEF : n;
    }
    // 恢复上次宽度
    const saved = parseInt((function(){ try { return localStorage.getItem(KEY); } catch (e) { return 0; } })());
    if (saved) setWidth(saved);

    let dragging = false;
    function moveTo(clientX) {
      // 面板在右侧：宽度 = 容器右边缘 - 指针 x
      setWidth(body.getBoundingClientRect().right - clientX);
    }
    splitter.addEventListener("pointerdown", e => {
      dragging = true;
      splitter.setPointerCapture(e.pointerId);
      document.body.classList.add("c-app--resizing");
      e.preventDefault();
    });
    splitter.addEventListener("pointermove", e => { if (dragging) moveTo(e.clientX); });
    function endDrag() { dragging = false; document.body.classList.remove("c-app--resizing"); }
    splitter.addEventListener("pointerup", endDrag);
    splitter.addEventListener("pointercancel", endDrag);
    splitter.addEventListener("dblclick", () => { body.style.setProperty("--panel-w", DEF + "px"); try { localStorage.removeItem(KEY); } catch (e) {} });
    // 键盘无障碍：← / → 调宽，Home 复位
    splitter.addEventListener("keydown", e => {
      const step = e.shiftKey ? 48 : 16;
      if (e.key === "ArrowLeft") { setWidth(currentWidth() + step); e.preventDefault(); }
      else if (e.key === "ArrowRight") { setWidth(currentWidth() - step); e.preventDefault(); }
      else if (e.key === "Home") { body.style.setProperty("--panel-w", DEF + "px"); try { localStorage.removeItem(KEY); } catch (x) {} e.preventDefault(); }
    });
    // 窗口变窄时收敛宽度
    window.addEventListener("resize", () => { if (window.innerWidth <= 900) return; setWidth(currentWidth()); });
  })();

  // 启动时预拉一次文件数，使徽章初始不为 0
  refreshFiles();

  input.focus();
})();
</script>
</body>
